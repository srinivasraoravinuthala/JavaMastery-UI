name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JavaMastery docs
        uses: actions/checkout@v4
        with:
          repository: srinivasraoravinuthala/JavaMastery
          path: JavaMastery
          sparse-checkout: |
            docs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run test

      - run: npm run validate-links -- ./JavaMastery/docs

      - run: npm run lint

      - run: npm run build:ci
