# Cloudflare Workers static assets (Vite SPA)
# Docs: https://developers.cloudflare.com/workers/static-assets/get-started/
#
# Dashboard build settings (Workers → Builds):
# Build command:                          npm run build:prod
#   Deploy command:                         npx wrangler deploy
#   Non-production branch deploy command:   npx wrangler versions upload
#
# Build-time env vars (Workers → Settings → Variables and secrets):
#   VITE_CONTENT_MODE = github

name = "javamastery"
compatibility_date = "2026-06-13"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
